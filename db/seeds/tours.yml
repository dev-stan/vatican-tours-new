- slug: naples-pompeii-herculaneum-oplontis
  title: Pompeii, Herculaneum, Oplontis
  tagline: Three Archaeological Treasures, One Extraordinary Journey
  headline: Three towns buried by Vesuvius, from the bustling streets of Pompeii to the luxury villa of Oplontis.
  location: Naples, Pompeii and Amalfi Coast
  hours: 6
  meeting_point: Pickup from your hotel in Naples
  languages: [en, es, fr, it]
  tags: [active]
  photos: [oplontis.webp, herculaneum.webp, vesuvius.webp]
  description: |
    Vesuvius buried more than one town in 79 AD, and each tells a different part of the story. This day visits three of them with an archaeologist, in the order that makes the most sense.

    Herculaneum comes first: smaller than Pompeii but better preserved, with wooden beams, upper floors, and the skeletons of the townspeople who sheltered in the boathouses by the shore.

    Then Oplontis, the seaside villa thought to belong to Nero’s wife Poppaea, with some of the finest wall paintings in the Roman world. The day ends in Pompeii itself, with its Forum, theatres, and bakeries.
  highlights:
    Herculaneum: Two-storey houses, carbonised wood, and the boathouse skeletons.
    Villa Poppaea at Oplontis: A luxury seaside villa with frescoes still bright after 2,000 years.
    Pompeii: The Forum, the theatres, and the streets of a whole Roman town.
    An archaeologist guide: Someone who has worked the sites, not just read about them.
