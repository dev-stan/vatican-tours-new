  meeting_point: Fondamenta Nove water taxi stand, Cannaregio
  languages: [en, es, fr, it, de]
  tags: [with_kids]
  description: |
    Before there was Venice, there was Torcello. Refugees from the mainland settled the island in the 400s, and at its height 20,000 people lived there. Today it has a dozen residents, a cathedral, and some of the finest mosaics in Italy.

    This full day by private water taxi visits the three great islands of the northern lagoon. It starts on Murano with a glassblowing demonstration, then crosses to Burano for its painted houses, its lace, and a seafood lunch.

    In the afternoon the boat takes you through the salt marshes to Torcello, where the Cathedral of Santa Maria Assunta holds a vast golden Last Judgment, older than St. Mark’s.
  highlights:
    Torcello Cathedral: Byzantine mosaics, and the Last Judgment in gold.
    Murano glass: A master glassmaker at work in a furnace.
    Burano: Painted houses, lace, and a lunch of lagoon seafood.
    The salt marshes: The wild, quiet lagoon most visitors never see.
