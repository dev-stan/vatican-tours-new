- slug: essential-florence-part-three-oltrarno
  title: Essential Florence Part Three, Oltrarno
  tagline: Across the River
  headline: Florence revealed — the Oltrarno and Masaccio’s frescoes.
  location: Florence
  hours: 3
  meeting_point: Ponte Santa Trinita, at the corner with Via Maggio
  languages: [en, it, fr]
  tags: [with_kids]
  description: |
    Across the Arno, Florence slows down. The Oltrarno is the city of artisans: gilders, framers, and leather workers in workshops that have been passed down for generations, around squares where locals still outnumber visitors.

    Our walk starts at Ponte Santa Trinita and winds through Santo Spirito, Brunelleschi’s last church, before reaching Santa Maria del Carmine and the Brancacci Chapel. Here Masaccio painted the frescoes that taught the Renaissance how to paint people with weight, shadow, and feeling, and every artist who came after, Michelangelo included, came to copy them.

    We finish with a stop in an artisan workshop and a walk along Via Maggio, Florence’s street of antique dealers, ending near Palazzo Pitti.
  highlights:
    The Brancacci Chapel: Masaccio’s frescoes, the starting point of Renaissance painting.
    Santo Spirito: Brunelleschi’s last church, and the piazza where the Oltrarno meets for an aperitivo.
    Artisan workshops: A visit to a family workshop still working the old way.
    Via Maggio: Palaces, antique shops, and the quieter side of Florence.
  included:
    - Reserved entry to the Brancacci Chapel
    - Licensed Florence guide
    - Artisan workshop visit
  excluded:
    - Palazzo Pitti and Boboli Gardens entry
    - Hotel pickup and drop-off
    - Food and drinks
  facts:
    Meeting point: Ponte Santa Trinita, at the corner with Via Maggio on the Oltrarno side.
    Chapel visits: Brancacci Chapel visits are timed and limited to small groups. When the chapel is closed, we visit the frescoes of Santa Felicita instead.
    Walking: About 3 km on flat streets with cobblestones in places.
