- slug: murano-and-burano-water-taxi
  title: Murano and Burano by Water Taxi
  tagline: Glass Furnaces and Painted Houses
  headline: Murano and Burano for glassmaking traditions and colourful island streets, by private water taxi.
  location: Venice
  hours: 4
