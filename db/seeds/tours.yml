- slug: pompeii-and-oplontis
  title: Pompeii and Oplontis, the Excavations
  tagline: A City Stopped Mid-Sentence
  headline: Pompeii’s ancient streets and Oplontis’ Roman villa
  location: Rome Day Trips
  hours: 10
  meeting_point: Roma Termini station, in front of the FRECCIALounge
  languages: [en, es, fr, it]
  tags: []
  photos: [oplontis.webp, herculaneum.webp, ostia_antica.webp]
  description: |
    In AD 79, Vesuvius buried Pompeii in a single afternoon. The town that came out of the ash two thousand years later still has its bakeries, bars, brothels, and election slogans painted on the walls.

    We take the high-speed train from Rome to Naples, where a driver takes you to the excavations. Your archaeologist guide leads you through the Forum, the baths, and the House of the Faun, and the casts of the people who didn’t escape.

    After lunch, we visit Oplontis, a short drive away. The Villa of Poppaea, thought to belong to Nero’s wife, has some of the finest wall paintings in the Roman world, and you will probably have it to yourselves.
  highlights:
    Pompeii with an archaeologist: The Forum, the baths, the brothel, and the best-preserved houses.
    Villa of Poppaea: Painted rooms and gardens in the villa of Nero’s second wife.
    Fast train both ways: Rome to Naples in 70 minutes, seats reserved.
    Lunch near the ruins: A Neapolitan pizza lunch near the excavations.
