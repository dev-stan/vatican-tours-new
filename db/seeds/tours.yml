- slug: essential-naples-part-two
  title: Essential Naples - Part Two
  tagline: Caravaggio, Opera, and the City Below
  headline: Capodimonte Painting Gallery, the San Carlo Opera House, and the Naples Underground.
  location: Naples, Pompeii and Amalfi Coast
  hours: 3
  meeting_point: Pickup from your hotel in central Naples
  languages: [en, es, it]
  tags: [with_kids]
  photos: [vesuvius.webp, capri_coastline.webp]
  description: |
    The second half of Naples is spread across the city, so we drive it. With a private car and driver, the tour links three sites that most visitors never manage to fit into one day.

    It starts on the hill of Capodimonte, in the Bourbon royal palace that now holds one of Italy’s great painting collections: Titian, Raphael, Bruegel, and Caravaggio’s Flagellation of Christ. Then down to the San Carlo, the oldest working opera house in Europe, for a look at its red-and-gold auditorium.

    The tour ends forty metres below the street, in the tunnels and cisterns the Greeks dug for water and Neapolitans later used as air-raid shelters.
  highlights:
