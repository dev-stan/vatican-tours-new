  description: |
    Vesuvius buried three very different places in AD 79: a busy town, a wealthy seaside resort, and a luxury villa. Seeing all three in one day shows how differently the eruption treated each.

    Herculaneum comes first, before the heat. Buried under twenty meters of volcanic mud rather than ash, it kept its wooden beams, furniture, and even food. Then it’s on to Oplontis and the painted Villa of Poppaea.

    After a pizza lunch, the afternoon is Pompeii: the Forum, the theaters, and the great houses, guided by an archaeologist who knows which streets to take to avoid the crowds.
  highlights:
    Herculaneum: Wooden beams, upper floors, and carbonized food, preserved under volcanic mud.
    Villa of Poppaea: Some of the finest Roman wall paintings anywhere.
    Pompeii’s highlights: The Forum, the theaters, and the House of the Vettii.
    One easy day: Fast train and private transfers so you spend your time on the sites.
