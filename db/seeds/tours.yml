  description: |
    Florence is small enough to cross in twenty minutes and dense enough to fill a lifetime. The first part of our Essential Florence series starts where most visitors want to begin: face to face with Michelangelo’s David.

    Your timed entry takes you straight into the Accademia Gallery. Before the David, your guide stops at the Prisoners, the unfinished figures that seem to fight their way out of the marble, and explains how a 26-year-old turned a block other sculptors had given up on into the symbol of a city.

    Back outside, we walk down to the Duomo and the Baptistery, past the workshops and palaces of the Medici quarter, and finish in Piazza della Signoria, where the copy of the David stands on the spot Michelangelo’s original was first unveiled.
  highlights:
    Michelangelo’s David: Reserved entry to the Accademia, with time to circle the statue and see it from every side.
    The Prisoners: Michelangelo’s unfinished figures, and what they reveal about how he carved.
    The Duomo and Baptistery: Brunelleschi’s dome and Ghiberti’s Gates of Paradise from the best angles.
    Piazza della Signoria: Florence’s civic heart, ringed by statues and the Palazzo Vecchio.
