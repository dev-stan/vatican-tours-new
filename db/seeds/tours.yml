  description: |
    Two cities in one day: one still loud and alive, the other frozen under ash since 79 AD. With a private car between them, the day is unhurried and the contrast is the point.

    The morning is spent in Naples’ historic centre, along Spaccanapoli and through the nativity workshops of San Gregorio Armeno, with a stop for espresso and a sfogliatella.

    After lunch, a forty-minute drive takes you to Pompeii. An archaeologist guide walks you through the Forum, the baths, the brothel, and the villas, and explains how the eruption that destroyed the town also saved it.
  highlights:
    Old Naples: Spaccanapoli, street shrines, and the nativity makers.
    Pompeii with an archaeologist: The Forum, the baths, and the painted villas.
    The plaster casts: The victims of Vesuvius, caught in their last moments.
