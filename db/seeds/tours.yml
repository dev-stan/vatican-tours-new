- slug: vatican-scavi-st-peters-tomb
  title: Vatican Scavi and St. Peter’s Tomb
  tagline: Beneath the Basilica
  headline: The Roman necropolis under St. Peter’s, down to the tomb of the apostle himself.
  location: Vatican City
  hours: 1.5
  meeting_point: The Swiss Guard post at the Arco delle Campane, left of St. Peter’s Basilica
  languages: [en, es, it]
  tags: []
  description: |
    Beneath the floor of St. Peter’s Basilica lies a street of Roman tombs, buried when Constantine levelled the hill to build the first church. Excavations in the 1940s uncovered it, and at the end of it, the grave believed to be St. Peter’s.

    Only around 250 people a day are allowed into the Scavi, in groups of a dozen, and the Vatican’s Excavations Office books them months ahead. We handle the application and meet you at the Swiss Guard post.

    Your guide leads you down through pagan and Christian mausoleums, still decorated with frescoes and mosaics, to the red wall and the bones found beside it. You come up in the Grottoes, beneath the papal altar.
  highlights:
    The Roman necropolis: A buried street of tombs, frescoes, and mosaics beneath the Basilica.
    St. Peter’s tomb: The red wall and the grave at the heart of the church.
    Very few visitors: Around 250 people a day, in groups of no more than 12.
    The Grottoes: You finish among the papal tombs beneath the high altar.
  included:
    - Scavi Office tickets and booking
    - Licensed Scavi guide
    - St. Peter’s Basilica access afterwards
  excluded:
    - Vatican Museums and Sistine Chapel
    - Hotel pickup and drop-off
  facts:
    Meeting point: The Swiss Guard post at the Arco delle Campane, left of St. Peter’s Basilica, 15 minutes before the start.
    Age limit: The Excavations Office does not admit children under 15.
    Underground: The passages are narrow, warm, and humid. Not suitable for anyone with claustrophobia or limited mobility.
