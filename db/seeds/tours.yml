    The Castelli Romani, the volcanic hills south of Rome, are where Romans go on weekends to eat and drink. The wine is crisp, the porchetta is famous, and the views stretch all the way back to the dome of St. Peter’s.

    The day starts in Castel Gandolfo, the pope’s summer town above Lake Albano. Then we drive the lake road to Nemi, known for wild strawberries, and on to a family winery for a cellar tour and tasting of their Frascati whites and local reds.

    Lunch is a long fraschetta-style meal in Ariccia: porchetta, cheese, cured meats, and house wine at shared tables. You head back to Rome full, relaxed, and with a bottle or two under your arm.
