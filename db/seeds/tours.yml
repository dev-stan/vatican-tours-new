- slug: hidden-venice
  title: Hidden Venice
  tagline: The Venice Venetians Live In
  headline: Quiet lanes and the local corners most visitors miss.
  location: Venice
  hours: 2
  meeting_point: Campo Santa Maria Formosa, by the church steps
  languages: [en, es, fr, it]
  tags: [with_kids]
  description: |
    Two streets away from the crowds of San Marco, Venice goes quiet. Washing hangs over the canals, children play football in the squares, and the bacari pour a glass of wine for a couple of euros. This walk takes you there.

    Your guide leads you through Castello and Cannaregio, past the hidden courtyard of the Corte Seconda del Milion where Marco Polo was born, the bookshop that keeps its books in a gondola, and the Jewish Ghetto, the first in the world.

    Along the way you’ll stop at a bacaro for a cicchetto and an ombra, the small glass of wine Venetians drink standing at the bar.
  highlights:
    Castello and Cannaregio: The neighbourhoods where Venetians still live and work.
    The Jewish Ghetto: The world’s first ghetto, and its five historic synagogues.
    Marco Polo’s courtyard: The hidden corner where the traveller grew up.
    A bacaro stop: Cicchetti and an ombra of wine, the Venetian way.
  included:
