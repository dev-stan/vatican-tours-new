    Basilica of St. Francis: Giotto’s frescoes and the saint’s tomb.
    Medieval Assisi: Pink stone lanes, the Roman Temple of Minerva, and St. Clare’s church.
    Umbrian lunch: Truffle pasta and Sagrantino wine.
    Spello: A flower-filled hill town with Pinturicchio’s masterpiece.
