    The Val d’Orcia is the Tuscany of postcards: cypress-lined roads, golden hills, and stone villages on every ridge. It’s also an easy day trip from Rome.

    Our first stop is Pienza, the ideal Renaissance town built by a pope in his home village, and famous for its pecorino cheese. Then we drive the valley road, stopping at the chapel of the Madonna di Vitaleta and the best viewpoints.

    Lunch is at a farm in Montepulciano, with a tasting of Vino Nobile in cellars dug into the hill. The last stop is Montalcino, home of Brunello, one of Italy’s most famous red wines, before the drive back to Rome.
