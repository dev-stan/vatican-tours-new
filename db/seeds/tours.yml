  description: |
    Two hours north of Rome, Umbria is all olive groves, pink stone towns, and quiet roads. At its center is Assisi, home of St. Francis and one of the great pilgrimage sites of Europe.

    Your guide starts at the Basilica of St. Francis, two churches stacked on top of each other, with Giotto’s frescoes of the saint’s life in the upper church and his tomb below. Then we walk up through the medieval town to the Piazza del Comune and the Basilica of St. Clare.

    After lunch with Umbrian truffles and local wine, we drive to Spello, a flower-filled hill town with Roman gates and Pinturicchio’s frescoes, before heading back to Rome.
