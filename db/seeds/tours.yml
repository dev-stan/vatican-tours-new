  photos: [ostia_antica.webp, roman_ruins.webp, appian_way.webp]
  description: |
    Pompeii gets the crowds, but Ostia Antica was Rome’s own harbor town, and it’s nearly as well preserved. Pair it with the Etruscan necropolis of Cerveteri and you get two civilizations in one day, without long drives.

    In Ostia, walk the main street past warehouses, apartment blocks, bakeries, and a theater that still hosts summer plays. Mosaics in the Square of the Corporations show where each shipping company kept its office.

    After lunch, we drive up the coast to Cerveteri, a UNESCO site where the Etruscans built their tombs like houses, complete with carved beds, chairs, and tools. Walking the streets of the necropolis feels like visiting a town that is still waiting for its people.
  highlights:
    Ostia Antica: Rome’s harbor town, with mosaics, taverns, and a working theater.
    The Square of the Corporations: Shipping company offices, each marked by its own mosaic.
    Banditaccia Necropolis: Etruscan tombs carved like homes, with beds and chairs in stone.
    Two sites, one easy drive: Air-conditioned car and short transfers between stops.
