- slug: essential-florence-part-four-grand-masters
  title: Essential Florence Part Four, Grand Masters
  tagline: Giotto, Fra Angelico, and Donatello
  headline: Florence revealed — Giotto, Fra Angelico, and Donatello.
  location: Florence
  hours: 3
  meeting_point: Piazza San Marco, at the steps of the Church of San Marco
  languages: [en, it, de]
  tags: []
  description: |
    The last part of Essential Florence is for travellers who’ve seen the David and the Uffizi and want to understand where it all came from. Three masters, three buildings, and a hundred years of art history in a morning.

    We begin at the Convent of San Marco, where Fra Angelico painted a fresco in each friar’s cell to help them pray. His Annunciation at the top of the stairs is one of the most quietly moving paintings in Italy.

    From there we cross to the Bargello, the old city prison turned sculpture museum, to see Donatello’s bronze David, the first free-standing nude since antiquity. We end in Santa Croce, where Giotto’s frescoes of St. Francis sit a few steps from the tombs of Michelangelo and Galileo.
  highlights:
    Fra Angelico at San Marco: The frescoed cells and the Annunciation at the top of the stairs.
    Donatello at the Bargello: The bronze David and the sculpture that came before Michelangelo.
    Giotto at Santa Croce: The frescoes that broke with the Middle Ages.
    Tombs of the greats: Michelangelo, Galileo, and Machiavelli under one roof.
  included:
    - Entry to San Marco, the Bargello, and Santa Croce
    - Licensed Florence guide
    - Headsets
  excluded:
