- slug: vip-uffizi-and-vasari-corridor
  title: VIP Uffizi and Vasari Corridor
  tagline: The Medici’s Private Passage
  headline: Uffizi treasures and an exclusive passage through the Vasari Corridor.
  location: Florence
  hours: 2.5
  meeting_point: Piazza della Signoria, by the Fountain of Neptune
  languages: [en, es, fr]
  tags: [wheelchair]
  description: |
    In 1565 Cosimo I de’ Medici had Vasari build a private corridor so he could walk from his offices in the Uffizi to his home in Palazzo Pitti without mixing with the people of Florence. Almost a kilometre long, it runs over the shops of the Ponte Vecchio and across the Arno.

    This tour begins with the highlights of the Uffizi, then enters the corridor, where visits are limited to a handful of small groups a day. Through its small round windows you’ll see the Ponte Vecchio and the river as the Medici saw them, and come out in the Boboli Gardens.
  highlights:
    The Vasari Corridor: The Medici’s elevated passage over the Ponte Vecchio, open to few visitors.
    Uffizi highlights: Botticelli, Leonardo, and Michelangelo before the corridor.
    Over the Arno: The river and the bridge through the corridor’s windows.
    Very small groups: No more than 8 guests.
  included:
    - Reserved Uffizi and Vasari Corridor entry
    - Licensed Florence guide
    - Headsets
  excluded:
    - Palazzo Pitti entry
    - Hotel pickup and drop-off
  facts:
    Meeting point: Piazza della Signoria, by the Fountain of Neptune, 15 minutes before the start.
    Closed Mondays: The Uffizi and the corridor are closed on Mondays.
    Ends in Boboli: The tour ends at the Boboli Gardens, a 10-minute walk from the Ponte Vecchio.
  prices: { adult: 149, child: 99, private: 890, max_guests: 8 }
  times: ["10:00", "14:30"]
