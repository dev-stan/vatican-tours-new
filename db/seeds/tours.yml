  description: |
    The Amalfi Coast road was carved into the cliffs in the 1800s, and it’s still one of the most beautiful drives in the world. With a private driver at the wheel, you can spend the whole day looking out of the window.

    The first stop is Positano, its houses stacked down the cliff to a pebble beach. Then on to Amalfi, once a maritime republic that rivalled Venice, for its striped cathedral and a lemon granita in the piazza.

    The day ends high above the sea in Ravello, where the gardens of Villa Rufolo and Villa Cimbrone look out over the coast from the terraces that inspired Wagner.
  highlights:
    Positano: Free time among the boutiques and beach cafés of the coast’s most famous village.
    Amalfi: The Cathedral of St. Andrew and the old maritime republic.
    Ravello: Villa Rufolo’s gardens and the Terrace of Infinity at Villa Cimbrone.
    The coast road: Photo stops at the best viewpoints, with a driver who knows them all.
