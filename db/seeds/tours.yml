- slug: venice-lagoon-murano-burano-torcello
  title: "Venice Lagoon: Murano, Burano and Torcello"
  tagline: Three Islands, One Lagoon
  headline: Murano’s glass, Burano’s colours, and Torcello’s Byzantine mosaics, by private water taxi.
  location: Venice
