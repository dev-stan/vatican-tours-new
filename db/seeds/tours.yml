- slug: essential-florence-part-two-uffizi
  title: Essential Florence Part Two with Uffizi
  tagline: Landmarks and Masterpieces
  headline: Florence’s iconic landmarks and the Uffizi’s Renaissance masterpieces.
  location: Florence
  hours: 3
  meeting_point: Piazza della Repubblica, under the arch on the western side of the square
  languages: [en, es, fr, it]
  tags: [with_kids, wheelchair]
  description: |
    The second part of Essential Florence joins the city’s great public spaces to the gallery the Medici built to show them off. It works on its own, or as the follow-up to Part One.

    We start in Piazza della Repubblica, the old Roman forum, and walk past Orsanmichele, the grain market turned church whose niches hold statues by Donatello and Verrocchio. From Piazza della Signoria it’s a few steps to the Uffizi, where your reserved entry skips the queue that wraps around the courtyard.

    Inside, your guide picks a route through the highlights: Giotto’s Madonna, Botticelli’s Birth of Venus and Primavera, Leonardo’s Annunciation, and Michelangelo’s only finished panel painting in Florence. The tour ends at the windows above the Arno, looking out at the Ponte Vecchio.
  highlights:
