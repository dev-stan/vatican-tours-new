# The tour catalogue, loaded by db/seeds.rb. Edit here, then run bin/rails db:seed.
#
# hours:       tour length (decimals allowed, e.g. 2.5)
# photos:      files in app/assets/images/tours; the first one is the card image (optional)
# description: paragraphs separated by a blank line; the first is the pitch
# prices:      euros. Adult (18+) and child (6–17) group tickets, private group price for up to max_guests.
#              Infants (0–5) go free. Every tour also gets a cancellation fact.
# times:       Rome start times, for both group and private departures
# days:        weekdays the tour runs (default: every day)
# capacity:    seats on a group departure (default 12)

- slug: ancient-rome-walking-tour
  title: Ancient Rome Walking Tour
  tagline: Two Thousand Years, Three Hours
  headline: Skip the Colosseum queue, climb the Palatine Hill where Rome began, and walk the Forum’s Sacred Way with an archaeologist at your side.
  location: Rome
  hours: 3
  meeting_point: Outside the Colosseo metro station exit on Via dei Fori Imperiali
  languages: [en, es, fr]
  tags: [wheelchair, with_kids]
  photos: [colloseum.webp, roman_ruins.webp, colloseum_underground.webp]
  description: |
    The Colosseum, the Forum, and the Palatine sit side by side, but most visitors see them as three separate queues. We walk them as one story — from the hut where Romulus lived to the arena where emperors bought the crowd’s loyalty.

    The Colosseum draws more visitors than any other site in Italy, and the ticket line can swallow your whole morning. Your priority pass takes you through the reserved entrance, so the first thing you see is the arena, not the back of someone’s hat.

    Inside, your guide walks you around the first tier to explain how 50,000 Romans were seated, fed, and kept in line. Then you cross the Arch of Constantine and climb the Palatine Hill, where the first Romans built their huts and later emperors built palaces on top of them.

    The tour ends in the Roman Forum, the political heart of the empire. Walk the Sacred Way past the Senate House and the Temple of Vesta, then stay as long as you like — your ticket is valid for the rest of the day.
  highlights:
    Straight into the Colosseum: Priority passes take you past the ticket queue and into the arena’s first tier in minutes.
    The Roman Forum: Walk the Sacred Way past the Senate House and the temple where Caesar was cremated.
    Palatine Hill: Climb to the ruins of the imperial palaces and the view the emperors woke up to.
    Guides who know the ground: Licensed archaeologists and historians who have dug, studied, and argued over these stones.
    Small group, or just you: Group tours cap at 12 guests. Go private and the route bends to your questions.
    Stories, not dates: Gladiators, fires, and political murders — the people who made the ruins matter.
  included:
    - Priority entry to the Colosseum
    - Roman Forum and Palatine Hill access
    - Licensed expert guide
    - Headsets so you hear every word
  excluded:
    - Colosseum underground and arena floor
    - Hotel pickup and drop-off
    - Food and drinks
  facts:
    Meeting point: Outside the Colosseo metro station exit on Via dei Fori Imperiali. Your guide will hold a Vatican Tours Inc sign.
    Bring ID: Colosseum tickets are issued in each guest’s name and checked at the gate. Bring a passport or ID card.
    Walking: About 3 km on uneven ancient paving with some steps and slopes. Comfortable shoes are a must.
    Accessibility: The Colosseum has a lift to the first tier; the Forum and Palatine are steep in places. Contact us for an adapted private route.
  prices: { adult: 65, child: 45, private: 390, max_guests: 8 }
  times: ["09:00", "10:30", "13:00", "14:30", "16:00"]

- slug: ancient-rome-in-depth-underground-colosseum
  title: Ancient Rome in Depth with Underground Colosseum
  tagline: Below the Arena Floor
  headline: In-depth archaeological sites with a cappuccino break
  location: Rome
  hours: 5
  meeting_point: Piazza del Colosseo, by the newsstand opposite the Colosseo metro exit
  languages: [en, es, de]
  tags: [active]
  photos: [colloseum_underground.webp, colloseum.webp, roman_ruins.webp]
  description: |
    Most visitors see the Colosseum from the stands. We take you underneath it, into the tunnels where gladiators waited and animals were hoisted into the light, then out onto the reconstructed arena floor to look back up at 50,000 empty seats.

    The underground hypogeum opens only to small groups with a licensed guide, and tickets go months ahead. We hold our own allocation, so your group walks straight from the security check down the stairs and into the passages beneath the sand.

    After a cappuccino break in a café the locals actually use, the tour continues through the Roman Forum and up onto the Palatine Hill. With five hours instead of three, there is time for the House of Augustus, the Stadium of Domitian, and the questions most tours rush past.
  highlights:
    The hypogeum: Walk the tunnels and lift shafts beneath the arena, closed to visitors without a guided ticket.
    The arena floor: Stand where the gladiators fought and look up at the tiers from below.
    A proper coffee break: Half an hour in a neighborhood café, cappuccino and cornetto on us.
    Forum and Palatine at leisure: Five hours means the House of Augustus and the corners other groups skip.
  included:
    - Underground and arena floor access
    - Roman Forum and Palatine Hill entry
    - Archaeologist guide
    - Cappuccino and pastry
    - Headsets
  excluded:
    - Lunch
    - Hotel pickup
  facts:
    Meeting point: Piazza del Colosseo, by the newsstand opposite the Colosseo metro exit. Please arrive 15 minutes early for the security check.
    Bring ID: Underground tickets are named and checked against a passport or ID card at the gate.
    Walking: About 5 km with steep steps underground and on the Palatine. Not suitable for wheelchairs or strollers.
  prices: { adult: 119, child: 89, private: 690, max_guests: 8 }
  times: ["08:30", "12:30"]
  capacity: 10

- slug: old-rome-walking-tour
  title: Old Rome Walking Tour
  tagline: Rome Between the Monuments
  headline: Centro storico, where locals outnumber tourists
  location: Rome
  hours: 3
  meeting_point: Piazza di Spagna, at the foot of the Spanish Steps by the Barcaccia fountain
  languages: [en, es, fr, it]
  tags: [with_kids]
  photos: [piazza_navona.webp, pantheon.webp, bernini_fountain.webp]
  description: |
    The famous sights of the centro storico sit a few minutes apart, linked by lanes most visitors never walk down. This tour strings them together the way Romans do — from the Spanish Steps to the Trevi Fountain, the Pantheon, and Piazza Navona, by way of the side streets in between.

    Your guide shows you where a pope dug up a Roman aqueduct to feed the Trevi, why the Pantheon’s dome has stood for 1,900 years without steel, and how Piazza Navona keeps the shape of the stadium beneath it.

    Along the way you will stop at an artisan bookbinder, a 400-year-old pharmacy, and the bar that serves Rome’s best espresso standing up. By the end you will know the old city well enough to find your way back for dinner.
  highlights:
    Trevi without the crush: We time the stop to miss the tour-bus waves, so there is room to toss your coin.
    Inside the Pantheon: Stand under the oculus of the best-preserved building of ancient Rome.
    Piazza Navona: Bernini’s Fountain of the Four Rivers, and the Roman stadium hidden under the square.
    Rome’s back lanes: Artisan workshops, hidden courtyards, and the coffee bar the guides use.
  included:
    - Licensed local guide
    - Pantheon entry
    - Espresso stop
    - Headsets for groups over six
  excluded:
    - Hotel pickup
    - Lunch
  facts:
    Meeting point: Piazza di Spagna, at the foot of the Spanish Steps by the Barcaccia fountain. Look for the Vatican Tours Inc sign.
    Dress code: The Pantheon is a working church. Shoulders and knees should be covered.
    Walking: About 3.5 km on cobblestones, mostly flat. Strollers are fine.
  prices: { adult: 49, child: 35, private: 320, max_guests: 8 }
  times: ["09:30", "14:00", "17:00"]

- slug: old-rome-by-golf-cart
  title: Old Rome by Golf Cart
  tagline: All of Rome, None of the Blisters
  headline: Top sights without walking; good for limited mobility
  location: Rome
  hours: 2
  meeting_point: Pickup from your hotel or apartment in central Rome
  languages: [en, es, it, pt]
  tags: [with_kids, wheelchair]
  photos: [golf_cart.webp, pantheon.webp, piazza_navona.webp]
  description: |
    Electric golf carts are allowed where coaches and taxis are not, so in two hours you glide through the lanes of the centro storico and stop at the places that matter — with a seat waiting every time your legs have had enough.

    Your driver-guide picks you up from your door and loops through the Trevi Fountain, the Pantheon, Piazza Navona, the Jewish Ghetto, and up to the Gianicolo terrace for the widest view over the domes of the city.

    It is the easiest way to see Rome with young children, grandparents, or anyone short on time. Carts take six guests and fold-up wheelchairs ride along in the back.
  highlights:
    Door-to-door: Pickup and drop-off at your hotel or apartment anywhere in the historic center.
    Gianicolo terrace: The best free view of Rome, reached without climbing a single step.
    Ten sights in two hours: Trevi, Pantheon, Navona, the Ghetto, Campo de’ Fiori, and more.
    Easy on everyone: Step-in seats, shade overhead, and room for a folding wheelchair or stroller.
  included:
    - Electric golf cart with driver-guide
    - Hotel pickup and drop-off in central Rome
    - Bottled water
  excluded:
    - Entry to monuments
    - Gratuities
  facts:
    Pickup: Your driver collects you from the door of your hotel or apartment in central Rome. Send us the address after booking.
    Accessibility: Guests need to step into the cart with a little help. Folding wheelchairs fit in the back.
    Weather: Carts have a roof and rain covers. In heavy storms we reschedule at no cost.
  prices: { adult: 89, child: 59, private: 420, max_guests: 5 }
  times: ["09:00", "11:00", "15:00", "17:00"]
  capacity: 6

- slug: rome-night-walk
  title: Night Walk
  tagline: Rome After Dark
  headline: Evening stroll through Rome’s streets and squares
  location: Rome
  hours: 2.5
  meeting_point: Piazza del Popolo, in front of the twin churches
  languages: [en, es, it]
  tags: [with_kids]
  photos: [trevi_night.webp, piazza_navona.webp, pantheon.webp]
  description: |
    Once the day-trippers leave and the floodlights come on, the centro storico turns back into a neighborhood. Fountains sound louder, piazzas fill with Romans on their evening passeggiata, and the monuments glow amber against the dark.

    The walk starts in Piazza del Popolo and winds down Via del Corso to the Trevi Fountain, lit up and finally quiet enough to hear. From there it is a short stroll to the Pantheon and on to Piazza Navona, where street artists set up under Bernini’s fountain.

    Halfway through we stop for gelato at a family-run gelateria — one of the few in town that still makes every flavor in the back room. It is a relaxed, unhurried way to spend your first or last evening in Rome.
  highlights:
    Trevi by night: Floodlit, and far quieter than at noon.
    Artisan gelato: A cone from a family gelateria that makes every flavor on site.
    The evening passeggiata: Join the Romans out for their after-dinner stroll.
    Photo stops: Your guide knows the angles for the best night shots.
  included:
    - Local guide
    - Artisan gelato
    - Headsets for groups over six
  excluded:
    - Dinner
    - Hotel drop-off
  facts:
    Meeting point: Piazza del Popolo, in front of the twin churches at the end of Via del Corso.
    Walking: About 3 km, flat and well lit. Fine for children and strollers.
    Ending: The tour ends in Piazza Navona, a short walk from plenty of restaurants. Your guide is happy to recommend one.
  prices: { adult: 45, child: 30, private: 280, max_guests: 8 }
  times: ["19:30", "21:00"]
  capacity: 14

- slug: appian-way-and-catacombs
  title: Appian Way and the Catacombs Tour
  tagline: The Queen of Roads
  headline: Catacombs visit and walk on the Appian Way
  location: Rome
  hours: 3
  meeting_point: Porta San Sebastiano, at the start of the Appian Way
  languages: [en, es, fr, de]
  tags: [with_kids]
  photos: [appian_way.webp, roman_ruins.webp, ostia_antica.webp]
  description: |
    The Appian Way left Rome in 312 BC and ran all the way to the heel of Italy. Its first miles are still paved with the original basalt stones, lined with umbrella pines, tombs, and the entrances to the underground cemeteries where early Christians buried their dead.

    We start at Porta San Sebastiano, the best-preserved gate in the Aurelian Walls, and walk the old road past the tomb of Cecilia Metella and the ruins of the Circus of Maxentius.

    Then we go underground. The Catacombs of San Callisto run for twenty kilometers on four levels, with chapels, frescoes, and the crypt of nine third-century popes. A specialist guide leads you through the galleries, and you come out blinking into the countryside a short walk from where you started.
  highlights:
    The original Roman road: Walk on basalt stones laid more than two thousand years ago.
    Catacombs of San Callisto: Four levels of underground galleries and the Crypt of the Popes.
    Tomb of Cecilia Metella: The grandest tomb on the road, later turned into a medieval fortress.
    Countryside in the city: Umbrella pines, sheep, and silence twenty minutes from the Colosseum.
  included:
    - Catacombs entry with specialist guide
    - Licensed local guide on the Appian Way
    - Bottled water
  excluded:
    - Transport to the meeting point
    - Food and drinks
  facts:
    Meeting point: Porta San Sebastiano, at the start of the Appian Way. Bus 118 from the Colosseum stops right outside.
    Inside the catacombs: The galleries are cool (around 15°C all year), narrow, and lit. Bring a light layer.
    Walking: About 4 km, partly on uneven ancient paving. The catacombs have stairs and are not wheelchair accessible.
  prices: { adult: 59, child: 39, private: 360, max_guests: 8 }
  times: ["09:30", "14:30"]
  days: [mon, tue, thu, fri, sat, sun]

- slug: rome-baroque-walking-tour
  title: Rome Baroque Walking Tour
  tagline: Marble That Moves
  headline: Caravaggio, Bernini, Borromini and the Borghese Gallery
  location: Rome
  hours: 3
  meeting_point: Entrance of the Borghese Gallery, Piazzale Scipione Borghese
  languages: [en, fr, it]
  tags: []
  photos: [borghese_gallery.webp, bernini_fountain.webp, piazza_navona.webp]
  description: |
    In the 1600s, a handful of artists remade Rome in marble and light. Bernini carved stone so it looked like skin, Borromini bent walls into waves, and Caravaggio painted saints with dirty feet. This tour takes you to their best work.

    We start in the Borghese Gallery, where reservations are timed and capped. Your guide leads you to Bernini’s Apollo and Daphne and Rape of Proserpina, then to the room of Caravaggios collected by the cardinal who couldn’t stop buying them.

    From there we walk through the Pincio gardens to the Caravaggios in Santa Maria del Popolo, then on to Borromini’s spiraling San Ivo and Bernini’s Fountain of the Four Rivers — and the rivalry between the two men that shaped the whole city.
  highlights:
    Borghese Gallery: Reserved entry to see Bernini’s sculptures and six Caravaggios up close.
    Apollo and Daphne: The moment a woman turns into a tree, carved in marble by a 24-year-old.
    Santa Maria del Popolo: Two Caravaggios hanging in the chapel they were painted for.
    Bernini versus Borromini: The rivalry behind the façades of Piazza Navona.
  included:
    - Reserved Borghese Gallery entry
    - Art historian guide
    - Headsets
  excluded:
    - Hotel pickup
    - Food and drinks
  facts:
    Meeting point: Entrance of the Borghese Gallery, Piazzale Scipione Borghese. Arrive 20 minutes early; entry times are strict.
    Bags: The gallery doesn’t allow bags larger than a handbag. The free cloakroom is next to the entrance.
    Walking: About 3 km, including a gentle downhill through the Villa Borghese gardens.
  prices: { adult: 79, child: 55, private: 450, max_guests: 8 }
  times: ["09:00", "13:00", "15:00"]
  days: [tue, wed, thu, fri, sat, sun]

- slug: jewish-rome-walking-tour
  title: Jewish Rome Walking Tour
  tagline: Two Thousand Years by the Tiber
  headline: The Jewish Ghetto and its history
  location: Rome
  hours: 3
  meeting_point: Largo 16 Ottobre 1943, in front of the Great Synagogue
  languages: [en, es, it]
  tags: [wheelchair]
  photos: [jewish_ghetto.webp, roman_piazza.webp, roman_ruins.webp]
  description: |
    Rome has the oldest Jewish community in Europe, here since before the Colosseum was built. Their story is told in the stones of a few streets by the Tiber, the area that was walled off as the Ghetto from 1555 until 1870.

    Your guide walks you through the old Ghetto, past the Portico d’Ottavia and the Theater of Marcellus, and over to Tiber Island. Along the way you hear about life behind the walls, the raid of 16 October 1943, and the community that rebuilt itself afterward.

    The tour ends with a visit to the Great Synagogue and the Jewish Museum of Rome, followed by time to try carciofi alla giudia — deep-fried artichokes — in one of the kosher restaurants on Via del Portico d’Ottavia.
  highlights:
    The Great Synagogue: Inside the square-domed temple built after the Ghetto walls came down.
    Jewish Museum of Rome: Two thousand years of Roman Jewish history, ritual silver, and textiles.
    Portico d’Ottavia: The Roman colonnade at the heart of the old Ghetto.
    Roman Jewish cooking: Your guide’s favorite spots for carciofi alla giudia and ricotta tart.
  included:
    - Synagogue and Jewish Museum entry
    - Licensed local guide
    - Headsets
  excluded:
    - Lunch
    - Hotel pickup
  facts:
    Meeting point: Largo 16 Ottobre 1943, in front of the Great Synagogue.
    Security: The synagogue has airport-style security. Bring a passport or ID card and leave large bags at your hotel.
    Closed days: The synagogue and museum are closed on Saturdays and Jewish holidays, so the tour doesn’t run then.
  prices: { adult: 55, child: 39, private: 340, max_guests: 8 }
  times: ["10:00", "14:30"]
  days: [sun, mon, tue, wed, thu, fri]

- slug: rome-underground-for-smart-kids
  title: Rome Underground for Smart Kids
  tagline: Dig Down Through Time
  headline: Rome’s ancient sights, made fun for kids
  location: Rome
  hours: 3
  meeting_point: In front of the Basilica of San Clemente, Via Labicana 95
  languages: [en, es, fr, de]
  tags: [with_kids]
  photos: [roman_ruins.webp, colloseum_underground.webp, colloseum.webp]
  description: |
    Rome is a layer cake: every century built on top of the last. This tour turns the city into a dig site for kids, going down three levels below street level to find what the Romans left behind.

    It starts at the Basilica of San Clemente, where a twelfth-century church sits on top of a fourth-century church, which sits on top of a Roman house and a temple to the god Mithras. Kids follow the sound of an underground river that still runs below it all.

    Then it’s on to the Colosseum valley for a gladiator-school session: how they trained, what they ate, and who actually won. Every child gets an explorer’s map and a sticker for each level they reach.
  highlights:
    Three levels down: Medieval church, early basilica, and a Roman house with a secret temple.
    The underground river: Hear a Roman water channel still rushing beneath the city.
    Gladiator school: Real stories of training, food, and fame, told for curious minds.
    Explorer’s kit: A map, a mission, and stickers to collect along the way.
  included:
    - San Clemente underground entry
    - Family specialist guide
    - Explorer’s map and kit for each child
  excluded:
    - Colosseum interior
    - Snacks and drinks
  facts:
    Meeting point: In front of the Basilica of San Clemente, Via Labicana 95, five minutes’ walk from the Colosseum.
    Best ages: Designed for kids aged 6 to 12, though younger siblings are welcome.
    Underground: Steep stairs and narrow passages. Strollers can be left at the entrance.
  prices: { adult: 59, child: 39, private: 360, max_guests: 8 }
  times: ["09:30", "14:30"]

- slug: angels-and-demons-tour
  title: On the Path of Angels and Demons Tour
  tagline: Follow the Path of Illumination
  headline: Rome’s hidden clues from Dan Brown’s novel
  location: Rome
  hours: 3
  meeting_point: Piazza del Popolo, at the obelisk
  languages: [en, es, de]
  tags: []
  photos: [bernini_fountain.webp, piazza_navona.webp, pantheon.webp]
  description: |
    In Angels and Demons, Robert Langdon races across Rome following four altars of science hidden in Bernini’s sculptures. The churches, fountains, and statues are all real, and you can follow the same trail in an afternoon.

    Your guide starts at Santa Maria del Popolo and the Chigi Chapel, where the first clue is hidden, then follows the Path of Illumination to Santa Maria della Vittoria and Bernini’s Ecstasy of St. Teresa.

    The trail ends at the Fountain of the Four Rivers in Piazza Navona and the Pantheon. Along the way you’ll learn where fact ends and fiction begins — and why the real history of the Illuminati is stranger than the novel.
  highlights:
    The Chigi Chapel: Where Langdon finds the first altar of science.
    Ecstasy of St. Teresa: Bernini’s most theatrical sculpture, and the novel’s altar of fire.
    Fountain of the Four Rivers: The water altar in the heart of Piazza Navona.
    Fact versus fiction: Bernini, the Illuminati, and what Dan Brown changed.
  included:
    - Licensed local guide
    - Entry to all churches on the route
    - Headsets
  excluded:
    - Transport between sights
    - Food and drinks
  facts:
    Meeting point: Piazza del Popolo, at the Egyptian obelisk in the center of the square.
    Dress code: The route visits four working churches. Cover shoulders and knees.
    Walking: About 4 km with a short metro ride between the second and third stops.
  prices: { adult: 55, child: 39, private: 340, max_guests: 8 }
  times: ["10:00", "15:00"]

- slug: rome-photography-tour
  title: Rome through the Lens with a Photographer
  tagline: Golden Hour in the Eternal City
  headline: Photo walk with a professional photographer
  location: Rome
  hours: 3
  meeting_point: Top of the Spanish Steps, in front of Trinità dei Monti
  languages: [en, it, fr]
  tags: []
  photos: [roman_piazza.webp, trevi_night.webp, piazza_navona.webp]
  description: |
    Rome is one of the most photographed cities on earth, and most of those photos look the same. Walk it with a working photographer and you will come home with pictures that don’t.

    Tours start at sunrise or before sunset, when the light turns gold and the crowds thin out. Your photographer leads you from the Spanish Steps through the backstreets of the Tridente to the Trevi Fountain and Piazza Navona, teaching composition, light, and the settings that matter.

    Bring any camera, from a phone to a full-frame kit. The group stays small, so there is time for one-on-one advice at every stop, and you get a short edit of your best shots by email the next day.
  highlights:
    Golden hour: Shoot in the softest light of the day, before the crowds or as the sun sets.
    A pro at your side: Hands-on tips on framing, light, and settings for any camera.
    Secret angles: Rooftop views and quiet corners the guidebooks don’t mention.
    Edited shots: Your photographer sends you edits of your five best photos.
  included:
    - Professional photographer guide
    - Editing of your five best photos
    - Bottled water
  excluded:
    - Camera equipment
    - Hotel pickup
  facts:
    Meeting point: Top of the Spanish Steps, in front of the church of Trinità dei Monti.
    Any camera: Phones are welcome. If you bring a camera, bring a charged spare battery.
    Group size: No more than six photographers per group.
  prices: { adult: 85, child: 55, private: 420, max_guests: 6 }
  times: ["07:00", "17:30"]
  capacity: 6

- slug: rome-all-the-sights
  title: Rome, All the Sights Walking Tour
  tagline: The Whole City in a Day
  headline: Old and Ancient Rome at a slow pace with a lunch break
  location: Rome
  hours: 6
  meeting_point: Outside the Colosseo metro station exit on Via dei Fori Imperiali
  languages: [en, es, fr, de, pt]
  tags: [active]
  photos: [pantheon.webp, colloseum.webp, trevi_night.webp]
  description: |
    If you have one full day in Rome, this is the tour. It covers the Colosseum, the Forum, and the old city at a pace that leaves time to look, sit, and eat properly in between.

    The morning is Ancient Rome: priority entry to the Colosseum, the Roman Forum, and the Capitoline Hill with its view over the ruins. Then we stop for a long Roman lunch of pasta and wine in a trattoria in Monti.

    The afternoon is Old Rome: the Pantheon, Piazza Navona, Campo de’ Fiori, and the Trevi Fountain, with a gelato stop on the way. You finish with a full picture of the city and a list of places to come back to.
  highlights:
    Colosseum and Forum: Priority entry and the full story of Ancient Rome.
    A real Roman lunch: Pasta, wine, and dessert at a trattoria in the Monti district.
    The centro storico: Pantheon, Navona, Campo de’ Fiori, and the Trevi Fountain.
    An unhurried pace: Six hours with breaks, so nobody gets left behind.
  included:
    - Priority Colosseum, Forum, and Palatine entry
    - Three-course lunch with wine
    - Gelato
    - Licensed guide and headsets
  excluded:
    - Hotel pickup
    - Gratuities
  facts:
    Meeting point: Outside the Colosseo metro station exit on Via dei Fori Imperiali.
    Bring ID: Colosseum tickets are named and checked at the gate. Bring a passport or ID card.
    Walking: About 8 km over the day with plenty of breaks. Wear comfortable shoes.
  prices: { adult: 109, child: 79, private: 650, max_guests: 8 }
  times: ["09:00"]

- slug: tivoli-and-hadrians-villa
  title: Tivoli Gardens and Hadrian’s Villa
  tagline: Where Emperors and Cardinals Escaped
  headline: Tivoli’s grand gardens and Hadrian’s vast villa
  location: Rome Day Trips
  hours: 6
  meeting_point: Pickup from your hotel in central Rome
  languages: [en, es, it]
  tags: []
  photos: [villa_deste.webp, countryside_palace.webp, roman_ruins.webp]
  description: |
    Thirty kilometers east of Rome, the town of Tivoli has been the city’s summer retreat for two thousand years. Emperor Hadrian built a private city here, and fifteen centuries later a cardinal built the most extravagant water garden in Europe.

    Your driver collects you from your hotel and heads first to Hadrian’s Villa, a sprawling complex of palaces, baths, and pools that the emperor designed himself. Walk the Canopus, a long pool lined with statues, and the island retreat where he went to be alone.

    After lunch in Tivoli, we cross town to Villa d’Este. Its terraced gardens hold hundreds of fountains, from the Hundred Fountains walk to the Organ Fountain, which still plays music using only water pressure.
  highlights:
    Hadrian’s Villa: An emperor’s private city of palaces, baths, and statue-lined pools.
    Villa d’Este: A Renaissance garden with hundreds of fountains cascading down the hillside.
