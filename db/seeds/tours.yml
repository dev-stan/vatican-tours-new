- slug: pompeii-herculaneum-vesuvius
  title: Pompeii, Herculaneum and Vesuvius
  tagline: Up the Volcano, Down Through History
  headline: Ancient ruins beneath Vesuvius
  location: Rome Day Trips
  hours: 10
  meeting_point: Roma Termini station, in front of the FRECCIALounge
  languages: [en, es, fr]
  tags: [active]
  photos: [vesuvius.webp, herculaneum.webp, positano.webp]
  description: |
    Stand on the rim of the volcano in the morning, and walk the streets it destroyed in the afternoon. This is the full story of AD 79, from the crater down.

    After the fast train to Naples, a driver takes you up the slopes of Vesuvius. A volcanologist guide leads the 30-minute climb to the crater rim, where steam still rises from the rocks and the whole Bay of Naples spreads out below.

    Back down, you visit Herculaneum, with its wooden houses preserved by volcanic mud, then Pompeii, the town buried under ash. By the end of the day you’ll understand exactly what happened, minute by minute.
  highlights:
    The crater rim: Climb to the top of Vesuvius with a volcanologist guide.
    Herculaneum: Preserved wood, upper floors, and the boathouses where people sheltered.
    Pompeii: The Forum, the bakeries, and the plaster casts of the victims.
    The Bay of Naples: Views from Capri to Sorrento from 1,170 meters up.
  included:
    - High-speed train tickets, Rome to Naples and back
    - Private transfers in Naples
    - Vesuvius National Park, Herculaneum, and Pompeii entry
    - Volcanologist and archaeologist guides
    - Packed lunch
  excluded:
    - Hotel pickup in Rome
    - Gratuities
  facts:
    Meeting point: Roma Termini station, in front of the FRECCIALounge, 20 minutes before departure.
    The climb: A 30-minute walk up a steep gravel path to the crater. Sturdy shoes are essential.
    Weather: In high winds the Vesuvius trail closes, and we replace the climb with Oplontis.
