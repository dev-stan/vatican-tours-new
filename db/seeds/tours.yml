  description: |
    Why spend three hours on the motorway when you could spend a day seeing northern Italy? This transfer takes you from Venice to Milan by way of Verona and the vineyards of Franciacorta.

    The first stop is Verona, for a walk with a local guide past the Roman Arena, Piazza delle Erbe, and the courtyard of Juliet’s house. Time for lunch, then back in the car.

    In the afternoon, you stop in Franciacorta, Italy’s answer to Champagne, for a cellar tour and tasting of its sparkling wines, before the last hour into Milan and your hotel.
