    Naples has been lived in for 2,800 years, and its old centre still follows the street grid the Greeks laid out. This walk takes you down Spaccanapoli, the long straight lane that splits the city in two, and into the museum that holds the treasures of Pompeii.

    Your guide leads you past the cloister of Santa Chiara with its painted majolica tiles, the nativity workshops of Via San Gregorio Armeno, and the street shrines and laundry lines that make Naples feel like nowhere else in Italy.

    The tour ends at the National Archaeological Museum, with the Farnese marbles, the mosaics and frescoes lifted from Pompeii, and the Secret Cabinet the Bourbon kings kept locked for a century.
  highlights:
    Spaccanapoli: The ancient Greek street that runs straight through the heart of Naples.
    San Gregorio Armeno: The street of nativity makers, busy all year round.
    The Archaeological Museum: Pompeii’s mosaics and frescoes, and the Farnese Hercules.
    A pizza stop: Pizza a portafoglio, folded and eaten on the street, the way Neapolitans do.
