  tagline: St. Mark’s, the Doge’s Palace, and the Rialto
  headline: The city’s timeless landmarks around San Marco.
  location: Venice
  hours: 2
  meeting_point: Piazza San Marco, under the Clock Tower
  languages: [en, es, fr, it, de]
  tags: [with_kids]
  description: |
    For a thousand years Venice was a republic of merchants, and everything around Piazza San Marco was built to show it off. This walk is the best introduction to the city: two hours, the great landmarks, and the stories that explain them.

    Your guide starts under the Clock Tower and walks you round the square Napoleon called the finest drawing room in Europe, with the golden mosaics of St. Mark’s Basilica and the pink-and-white Doge’s Palace beside it.

    From the Bridge of Sighs, the route winds through the lanes of the Mercerie to the Rialto Bridge, where the city’s market has traded since the 1100s.
  highlights:
    Piazza San Marco: The Basilica, the Campanile, and the Clock Tower.
    The Doge’s Palace: The seat of the Venetian Republic, and the Bridge of Sighs behind it.
    The Mercerie: The old shopping street linking San Marco to the Rialto.
    The Rialto Bridge: The Grand Canal from its most famous bridge.
  included:
