    Venice was built to be seen from the water, and the palaces of the Grand Canal still turn their best faces to it. This tour shows you the city both ways: on foot through its lanes, and by private water taxi along its main street.

    The first half is a walk from San Marco through the old city, with your guide explaining how a republic of merchants built an empire on a lagoon, then visiting St. Mark’s Basilica with its thousand-year-old mosaics.

    Then you board a polished wooden water taxi for the length of the Grand Canal, past the Ca’ d’Oro, the Rialto, and the palaces where Byron and Wagner lived, to the railway station and back.
