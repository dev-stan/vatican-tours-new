    Vines have grown in the Venetian lagoon since the Middle Ages, when monasteries and noble families planted them on the islands for their own tables. A few still do, and the wine they make tastes of salt and sea air.

    By private water taxi, you cross the lagoon to Burano for its painted houses and lace, then walk over the wooden bridge to the island of Mazzorbo and a walled vineyard replanted with Dorona, the golden grape of the old Republic.

