  description: |
    Renaissance cardinals spent their summers in the hills of Lazio, and they built palaces there to rival anything in Rome. Few tourists make the trip, so the rooms and gardens are often empty.

    The day starts at Palazzo Farnese in Caprarola, a pentagon-shaped palace with a spiral staircase wide enough for a horse and painted rooms covered in maps of the known world.

    After lunch in a country trattoria, we visit Villa Lante in Bagnaia. Its formal garden is a waterworks, with a water chain, a stone table with a channel in the middle for cooling wine, and fountains that step down the hill to the village.
  highlights:
    Palazzo Farnese: A pentagonal palace with frescoed map rooms and a grand spiral staircase.
    Villa Lante: One of the finest Renaissance gardens in Italy, built around running water.
