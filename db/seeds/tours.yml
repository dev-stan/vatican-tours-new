  languages: [en, es, fr, it, de, pt]
  tags: [with_kids]
  description: |
    The islands of the northern lagoon are a world apart from Venice, and a private water taxi gets you there in a fraction of the time the public boats take.

    On Murano, glassmakers have worked since 1291, when the Republic moved its furnaces off the main island for fear of fire. You’ll watch a master shape molten glass in a working furnace and stroll the canal lined with workshops.

    Then on to Burano, where every house is painted a different colour and lacemakers still work by hand. Wander the streets, try the butter biscuits called bussolai, and take the water taxi back when you’re ready.
  highlights:
    A glass furnace: Watch a Murano master shape molten glass in front of you.
    Burano’s colours: The brightest street in Italy, house by house.
    Handmade lace: The lacemakers of Burano and their centuries-old craft.
    Your own boat: A private water taxi across the lagoon, no public ferries.
