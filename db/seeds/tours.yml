    - Headsets for groups over six
  excluded:
    - Basilica and Doge’s Palace entry
    - Food and drinks
  facts:
    Meeting point: Piazza San Marco, under the Clock Tower. Your guide will hold a Vatican Tours Inc sign.
    Acqua alta: In autumn and winter, high tides can flood the square. We provide boot covers if needed.
    Walking: About 2 km with several bridges and steps. Strollers are hard work in Venice.
  prices: { adult: 49, child: 35, private: 320, max_guests: 8 }
