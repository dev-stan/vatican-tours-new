  languages: [en, es, it]
  tags: [active]
  description: |
    Brunelleschi’s Dome was the largest in the world when it was finished in 1436, and nobody is quite sure how he built it without a wooden frame. This tour takes you inside the cathedral’s structure to find out.

    With a guide and special access, you climb to the terraces along the cathedral’s roof, closed to regular visitors, with views straight down into the nave and out across the city. Then you continue up between the dome’s two shells, past Vasari’s Last Judgment frescoes, to the lantern at the top and the best view in Florence.
  highlights:
    The secret terraces: Walk the cathedral roof, closed to regular visitors.
    Inside the dome: Climb between Brunelleschi’s two shells and see how it was built.
    The Last Judgment: Vasari’s fresco, up close from the inner gallery.
    The view from the top: All of Florence, and the hills beyond.
  included:
